<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=pause" />
    <title>SteveXdemo</title>
</head>

<body class="background">

    <div id="loader-wrapper">
        <div class="upside-down-loader">
            <h1 class="loading-text">Entering the upside down
                <span class="dots"><span>.</span><span>.</span><span>.</span><span>.</span></span>
            </h1>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>


            <div id="audio-trigger" class="bat-container">
                <img src="img/bat-pixel.webp" alt="Steve's Bat" class="bat-sprite">
                <p class="bat-text">PREPARE FOR SURVIVAL : CLICK TO SYNC</p>
            </div>

        </div>
    </div>


    <div class="openManual btn" title="Help!">
        <span>?</span>
    </div>

    <div class="manualOverlay">

        <div class="manual-card">
            <div class="back">
                <button id="backBtn" class="btn_2"><svg xmlns="http://www.w3.org/2000/svg" height="24px"
                        viewBox="0 -960 960 960" width="24px" fill="#e3e3e3">
                        <path d="M560-280 360-480l200-200v400Z" />
                    </svg>Back</button>
            </div>
            <h2 class="manual-title">How To Play ?</h2>

            <div class="control-lists">
                <div class="control-row row-top">
                    <span class="action-text">Jump</span>
                    <span class="key-display">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                            fill="#e3e3e3">
                            <path d="M440-160v-487L216-423l-56-57 320-320 320 320-56 57-224-224v487h-80Z" />
                        </svg>
                    </span>
                </div>

                <div class="row-bottom">
                    <div class="control-row">
                        <span class="key-display">
                            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                                fill="#e3e3e3">
                                <path d="m313-440 224 224-57 56-320-320 320-320 57 56-224 224h487v80H313Z" />
                            </svg>
                        </span>
                        <span class="action-text"> Move Backward </span>
                    </div>

                    <div class="control-row">
                        <span class="key-display">
                            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                                fill="#e3e3e3">
                                <path d="M647-440H160v-80h487L423-744l57-56 320 320-320 320-57-56 224-224Z" />
                            </svg>
                        </span>
                        <span class="action-text">Move Forward</span>
                    </div>

                </div>

            </div>

        </div>

    </div>


    <div class="startContainer">
        <div class="startPage" style="background-color: transparent;">

            <div class="game-title">
                <span class="gameN1">
                    <h1>Steve</h1>
                </span>
                <span class="cross">
                    <span class="line red-line">
                        <h2 class="none" style="display: none;">───────</h2>
                    </span>
                    <h1>X</h1>
                    <span class="line cyan-line">
                        <h2 class="none" style="display: none;">───────</h2>
                    </span>
                </span>
                <span class="gameN2">
                    <h1>Demodog</h1>
                </span>
                <p>Survive Hawkins. Escape the Upside down. </p>

            </div>
            <div class="main-btns">
                <button id="start-G" class="btn"><i class="fa-sharp fa-solid fa-play"></i>Start Game</button>
                <button id="exit-G" class="btn"><i class="fa-solid fa-arrow-right-from-bracket"></i>Exit Game</button>
                <button id="mute-unmute" class="btn"><i class="fa-sharp fa-solid fa-volume-up"></i>Mute</button>
            </div>
        </div>
    </div>

</body>
<script src="start.js"></script>

</html>
